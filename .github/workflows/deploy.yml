name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Align source for active modules
        run: |
          cat > /tmp/supplier_panel.txt <<'SUPPLIER'
          function SupplierPanel({ rows, deleteSupplier, onChange, canEdit }: { rows: Supplier[]; addSupplier: () => void | Promise<string>; deleteSupplier: (id: string) => void; onChange: (row: Supplier) => void | Promise<void>; canEdit: boolean }) {
            const [query, setQuery] = useState("");
            const sourceRows = rows.length ? rows : suppliersInitial;
            const [sortBy, setSortBy] = useState<SupplierSort>("spend");
            const [draftRows, setDraftRows] = useState(sourceRows);
            const [editingIds, setEditingIds] = useState<Set<string>>(new Set());
            const [savedId, setSavedId] = useState("");
            const [selectedSupplierId, setSelectedSupplierId] = useState("");
            useEffect(() => {
              setDraftRows((current) => {
                const draftsById = new Map(current.map((row) => [row.id, row]));
                return sourceRows.map((row) => editingIds.has(row.id) ? draftsById.get(row.id) || row : row);
              });
            }, [sourceRows, editingIds]);
            const filteredBaseRows = draftRows
              .filter((row) => row.name.toLowerCase().includes(query.toLowerCase()) || row.category.toLowerCase().includes(query.toLowerCase()))
              .sort((a, b) => sortBy === "spend" ? Number(b.spend || 0) - Number(a.spend || 0) : a.name.localeCompare(b.name, "pt-BR"));
            const controlRows = filteredBaseRows.filter((row) => isSupplierScoped(row) || editingIds.has(row.id) || row.id === selectedSupplierId);
            const dashboardRows = draftRows.filter((item) => item.showOnDashboard);
            const updateDraft = (next: Supplier) => {
              setDraftRows((current) => current.map((row) => row.id === next.id ? next : row));
              setSavedId("");
            };
            const startEdit = (id: string) => {
              setEditingIds((current) => new Set([...current, id]));
              setSavedId("");
            };
            const cancelRow = (id: string) => {
              const original = sourceRows.find((row) => row.id === id);
              if (original) setDraftRows((current) => current.map((row) => row.id === id ? original : row));
              setEditingIds((current) => {
                const next = new Set(current);
                next.delete(id);
                return next;
              });
              setSavedId("");
            };
            const saveRow = async (row: Supplier) => {
              const next = {
                ...row,
                nextInteraction: "",
                agendaDate: "",
                relationshipStatus: row.conversationDone ? "Realizado" : row.agendaScheduled ? "Agendado" : "Selecionado",
                interactionStatus: row.conversationDone ? "Realizado" : row.agendaScheduled ? "Agendado" : "Selecionado",
                conversationDate: row.conversationDone ? (row.conversationDate || todayDate()) : "",
                firstInteraction: row.conversationDone ? (row.firstInteraction || row.conversationDate || todayDate()) : ""
              };
              await onChange(next);
              setEditingIds((current) => {
                const updated = new Set(current);
                updated.delete(row.id);
                return updated;
              });
              setSavedId(row.id);
            };
            const removeFromTracking = async (row: Supplier) => {
              if (!window.confirm("Remover este fornecedor do acompanhamento? Nome, categoria e spend serao preservados.")) return;
              const next = {
                ...row,
                contact: "",
                contactRole: "",
                notes: "",
                phone: "",
                email: "",
                showOnDashboard: false,
                agendaScheduled: false,
                agendaDate: "",
                conversationDone: false,
                nextInteraction: "",
                firstInteraction: "",
                conversationDate: "",
                relationshipStatus: "Mapear",
                interactionStatus: "Nao iniciado"
              };
              await onChange(next);
              setSelectedSupplierId((current) => current === row.id ? "" : current);
              setEditingIds((current) => {
                const updated = new Set(current);
                updated.delete(row.id);
                return updated;
              });
              setSavedId("");
            };
            const selectSupplier = (id: string) => {
              if (!id) {
                setSelectedSupplierId("");
                return;
              }
              setSelectedSupplierId(id);
              const selected = draftRows.find((row) => row.id === id);
              if (selected && !isSupplierScoped(selected)) {
                updateDraft({ ...selected, relationshipStatus: "Selecionado", interactionStatus: "Selecionado" });
              }
              startEdit(id);
            };
            return (
              <Panel
                title="Fornecedores"
                action={
                  <div className="flex flex-wrap gap-2">
                    <button className="btn" onClick={() => downloadSuppliersPdf(controlRows)}><FileDown size={16} /> Exportar PDF</button>
                    {!canEdit && <Badge tone="warn">Somente leitura</Badge>}
                  </div>
                }
              >
                <div className="mb-4 grid gap-3 sm:grid-cols-4">
                  <Metric title="Base fornecedores" value={String(draftRows.length)} note="disponiveis para selecionar" />
                  <Metric title="Em acompanhamento" value={String(controlRows.length)} note="selecionados/preenchidos" />
                  <Metric title="No dashboard" value={String(dashboardRows.length)} note="marcados para progresso geral" />
                  <Metric title="Realizados" value={String(dashboardRows.filter((item) => item.conversationDone).length)} note="bate-papos concluidos" />
                </div>
                <div className="mb-4 grid gap-3 lg:grid-cols-[1fr_220px]">
                  <Select disabled={!canEdit} label="Selecionar fornecedor da base" value={selectedSupplierId} onChange={selectSupplier} options={["", ...filteredBaseRows.map((item) => item.id)]} labels={{ "": "Selecione para acompanhar", ...Object.fromEntries(filteredBaseRows.map((item) => [item.id, `${item.name} | ${money(item.spend)}`])) }} />
                  <Select label="Ordenar por" value={sortBy} onChange={(value) => setSortBy(value as SupplierSort)} options={["spend", "name"]} labels={{ spend: "Spend", name: "Nome" }} />
                </div>
                <div className="mb-4 max-w-xl">
                  <SearchBox value={query} onChange={setQuery} placeholder="Filtrar base por fornecedor ou categoria" />
                </div>
                <div className="overflow-x-auto rounded-md border border-line bg-surface">
                  <table className="w-full min-w-[780px] text-left text-sm">
                    <thead className="border-b border-line bg-card text-xs uppercase text-muted">
                      <tr>
                        <th className="w-[42%] p-3">Fornecedor</th>
                        <th className="w-[18%] p-3">Spend</th>
                        <th className="w-[12%] p-3 text-center">Dashboard</th>
                        <th className="w-[12%] p-3 text-center">Agenda</th>
                        <th className="w-[12%] p-3 text-center">Realizado</th>
                        {canEdit && <th className="w-[22%] p-3 text-right">Acoes</th>}
                      </tr>
                    </thead>
                    <tbody>
                      {controlRows.slice(0, 120).map((row) => {
                        const editing = editingIds.has(row.id);
                        return (
                          <tr key={row.id} className="border-b border-line/70 last:border-b-0">
                            <td className="p-2 align-top">
                              <input className="field" disabled={!canEdit || !editing} value={row.name || ""} onChange={(event) => updateDraft({ ...row, name: event.target.value })} />
                            </td>
                            <td className="p-2 align-top">
                              <ReadOnly label="" value={money(row.spend)} />
                            </td>
                            <td className="p-2 text-center align-top">
                              <input className="mt-3 h-5 w-5 accent-leaf" disabled={!canEdit || !editing} type="checkbox" checked={row.showOnDashboard} onChange={(event) => updateDraft({ ...row, showOnDashboard: event.target.checked })} />
                            </td>
                            <td className="p-2 text-center align-top">
                              <input className="mt-3 h-5 w-5 accent-leaf" disabled={!canEdit || !editing} type="checkbox" checked={row.agendaScheduled} onChange={(event) => updateDraft({ ...row, agendaScheduled: event.target.checked })} />
                            </td>
                            <td className="p-2 text-center align-top">
                              <input className="mt-3 h-5 w-5 accent-leaf" disabled={!canEdit || !editing} type="checkbox" checked={row.conversationDone} onChange={(event) => updateDraft({ ...row, conversationDone: event.target.checked })} />
                            </td>
                            {canEdit && (
                              <td className="p-2 text-right align-top">
                                <div className="flex flex-wrap justify-end gap-2">
                                  {!editing ? (
                                    <button className="btn" onClick={() => startEdit(row.id)}><Edit3 size={16} /> Editar</button>
                                  ) : (
                                    <>
                                      <button className="btn" onClick={() => saveRow(row)}><Save size={16} /> Salvar</button>
                                      <button className="btn" onClick={() => cancelRow(row.id)}>Cancelar</button>
                                    </>
                                  )}
                                  <button className="btn" disabled={editing} onClick={() => Number(row.spend || 0) > 0 ? removeFromTracking(row) : deleteSupplier(row.id)}><Trash2 size={16} /> Remover</button>
                                </div>
                                {savedId === row.id && <span className="mt-2 inline-block text-xs font-semibold text-leaf">Salvo</span>}
                              </td>
                            )}
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                  {!controlRows.length && <p className="p-3 text-sm text-muted">Selecione um fornecedor na lista suspensa para iniciar o acompanhamento.</p>}
                  {controlRows.length > 120 && <p className="p-3 text-sm text-muted">Mostrando 120 de {controlRows.length} fornecedores em acompanhamento. Use a busca para refinar.</p>}
                </div>
                <div className="mt-5 rounded-md border border-line bg-surface p-3">
                  <div className="mb-3 flex flex-wrap items-center justify-between gap-2">
                    <h3 className="font-semibold">Fornecedores x spend</h3>
                    <Badge>{draftRows.filter((item) => item.conversationDone).length} bate-papos realizados</Badge>
                  </div>
                  <div className="max-h-80 overflow-auto">
                    <table className="w-full min-w-[720px] text-left text-sm">
                      <thead className="sticky top-0 border-b border-line bg-card text-xs uppercase text-muted">
                        <tr>
                          <th className="p-2">Fornecedor</th>
                          <th className="p-2">Categoria</th>
                          <th className="p-2 text-right">Spend</th>
                          <th className="p-2">Status</th>
                        </tr>
                      </thead>
                      <tbody>
                        {filteredBaseRows.map((row) => (
                          <tr key={`${row.id}-spend`} className="border-b border-line/70">
                            <td className="p-2 font-medium">{row.name}</td>
                            <td className="p-2 text-muted">{row.category || "Sem categoria"}</td>
                            <td className="p-2 text-right font-semibold">{money(row.spend)}</td>
                            <td className="p-2">{row.conversationDone ? "Realizado" : row.agendaScheduled ? "Agendado" : "Pendente"}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </Panel>
            );
          }
          SUPPLIER
          node <<'NODE'
          const fs = require('fs');
          const supplier = fs.readFileSync('/tmp/supplier_panel.txt', 'utf8').replace(/^          /gm, '').trimEnd();
          function replaceAll(file, transform) {
            const before = fs.readFileSync(file, 'utf8');
            const after = transform(before);
            if (after !== before) fs.writeFileSync(file, after);
          }
          replaceAll('src/App.tsx', (input) => {
            let app = input;
            app = app.replace(/function SupplierPanel\([\s\S]*?\n\}\n\nfunction DiagnosisPanel/, `${supplier}\n\nfunction DiagnosisPanel`);
            app = app.replace('const firstDayValue = import.meta.env.VITE_FIRST_DAY || "2026-06-22";', 'const firstDayValue = import.meta.env.VITE_FIRST_DAY || "2026-08-03";');
            app = app.replace('note="9 frentes"', 'note="6 frentes ativas"');
            return app;
          });
          replaceAll('README.md', (input) => input
            .replace('Fornecedores estrategicos com selecao por lista suspensa a partir da base de spend, acompanhamento editavel por linha, pessoa contatada, cargo, agenda, realizado, marcador de dashboard, tabela de spend de referencia e exportacao PDF', 'Fornecedores estrategicos com selecao por lista suspensa a partir da base de spend, acompanhamento simples por linha, agenda, realizado, marcador de dashboard, tabela de spend de referencia e exportacao PDF')
            .replace('VITE_FIRST_DAY=2026-06-22', 'VITE_FIRST_DAY=2026-08-03'));
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- src/App.tsx README.md; then
            git add src/App.tsx README.md
            git commit -m "Fix supplier tracking UI"
            git push origin HEAD:main
          fi
      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://fokdjnqseqppmrjkimfu.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_C7pVM61DBzPfD0jqHLaCDQ_iR4Og0np
          VITE_FIRST_DAY: "2026-08-03"
      - name: Publish static site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir ../gh-pages-build
          cp -R dist/. ../gh-pages-build/
          touch ../gh-pages-build/.nojekyll
          cd ../gh-pages-build
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy GitHub Pages"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
