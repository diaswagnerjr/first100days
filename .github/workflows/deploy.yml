name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://fokdjnqseqppmrjkimfu.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_C7pVM61DBzPfD0jqHLaCDQ_iR4Og0np
          VITE_FIRST_DAY: "2026-06-22"
      - name: Publish static site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir ../gh-pages-build
          cp -R dist/. ../gh-pages-build/
          touch ../gh-pages-build/.nojekyll
          cd ../gh-pages-build
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy GitHub Pages"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
