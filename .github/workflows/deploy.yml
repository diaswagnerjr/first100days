name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Align source for active modules
        run: |
          node <<'NODE'
          const fs = require('fs');
          function replaceAll(file, transform) {
            const before = fs.readFileSync(file, 'utf8');
            const after = transform(before);
            if (after !== before) fs.writeFileSync(file, after);
          }
          replaceAll('src/App.tsx', (input) => {
            let app = input;
            app = app.replace(
              'function SupplierPanel({ rows, deleteSupplier, onChange, canEdit }: { rows: Supplier[]; addSupplier: () => void | Promise<string>; deleteSupplier: (id: string) => void; onChange: (row: Supplier) => void | Promise<void>; canEdit: boolean })',
              'function SupplierPanel({ rows, deleteSupplier, onChange, canEdit }: { rows: Supplier[]; deleteSupplier: (id: string) => void; onChange: (row: Supplier) => void | Promise<void>; canEdit: boolean })'
            );
            app = app.replace(
              /<SupplierPanel canEdit=\{canEdit\} rows=\{data\.suppliers\} addSupplier=\{\(\) => addRow\("suppliers", \{[^\n]+?\}\)\} deleteSupplier=\{\(id\) => deleteRow\("suppliers", id\)\} onChange=\{\(row\) => upsertRow\("suppliers", row\)\} \/>/,
              '<SupplierPanel canEdit={canEdit} rows={data.suppliers} deleteSupplier={(id) => deleteRow("suppliers", id)} onChange={(row) => upsertRow("suppliers", row)} />'
            );
            app = app.replace('const firstDayValue = import.meta.env.VITE_FIRST_DAY || "2026-06-22";', 'const firstDayValue = import.meta.env.VITE_FIRST_DAY || "2026-08-03";');
            app = app.replace('note="9 frentes"', 'note="6 frentes ativas"');
            app = app.replace(
              'overall: (peopleProgress + handoverProgress + coachingProgress + benchmarkProgress + criticalProcessesProgress + deliveryProgress + stakeholderProgress + supplierProgress + pillarProgress) / 9,',
              'overall: (peopleProgress + handoverProgress + coachingProgress + benchmarkProgress + stakeholderProgress + supplierProgress) / 6,'
            );
            app = app.replace(/(const \[savedId, setSavedId\] = useState\(""\);\r?\n)(?!  const \[selectedSupplierId)/, '$1  const [selectedSupplierId, setSelectedSupplierId] = useState("");\n');
            app = app.replace(
              /  const visible = draftRows\r?\n    \.filter\(\(row\) => row\.name\.toLowerCase\(\)\.includes\(query\.toLowerCase\(\)\) \|\| row\.category\.toLowerCase\(\)\.includes\(query\.toLowerCase\(\)\)\)\r?\n    \.sort\(\(a, b\) => sortBy === "spend" \? Number\(b\.spend \|\| 0\) - Number\(a\.spend \|\| 0\) : a\.name\.localeCompare\(b\.name, "pt-BR"\)\);\r?\n  const dashboardRows/,
              '  const filteredBaseRows = draftRows\n    .filter((row) => row.name.toLowerCase().includes(query.toLowerCase()) || row.category.toLowerCase().includes(query.toLowerCase()))\n    .sort((a, b) => sortBy === "spend" ? Number(b.spend || 0) - Number(a.spend || 0) : a.name.localeCompare(b.name, "pt-BR"));\n  const controlRows = filteredBaseRows.filter((row) => isSupplierScoped(row) || editingIds.has(row.id) || row.id === selectedSupplierId);\n  const dashboardRows'
            );
            app = app.replace('downloadSuppliersPdf(visible)', 'downloadSuppliersPdf(controlRows)');
            app = app.replace(
              /      <div className="mb-4 grid gap-3 sm:grid-cols-4">\r?\n        <Metric title="Fornecedores" value=\{String\(draftRows\.length\)\} note="base carregada" \/>\r?\n        <Metric title="No dashboard" value=\{String\(dashboardRows\.length\)\} note="marcados para progresso geral" \/>\r?\n        <Metric title="Realizados" value=\{String\(dashboardRows\.filter\(\(item\) => item\.conversationDone\)\.length\)\} note="bate-papos concluidos" \/>\r?\n        <Select label="Ordenar por" value=\{sortBy\} onChange=\{\(value\) => setSortBy\(value as SupplierSort\)\} options=\{\["spend", "name"\]\} labels=\{\{ spend: "Spend", name: "Nome" \}\} \/>\r?\n      <\/div>/,
              '      <div className="mb-4 grid gap-3 sm:grid-cols-4">\n        <Metric title="Base fornecedores" value={String(draftRows.length)} note="disponiveis para selecionar" />\n        <Metric title="Em acompanhamento" value={String(controlRows.length)} note="selecionados/preenchidos" />\n        <Metric title="No dashboard" value={String(dashboardRows.length)} note="marcados para progresso geral" />\n        <Metric title="Realizados" value={String(dashboardRows.filter((item) => item.conversationDone).length)} note="bate-papos concluidos" />\n      </div>'
            );
            const selectFn = `\n  const removeFromTracking = async (row: Supplier) => {\n    if (!window.confirm("Remover este fornecedor do acompanhamento? Nome, categoria e spend serao preservados.")) return;\n    const next = {\n      ...row,\n      contact: "",\n      contactRole: "",\n      notes: "",\n      phone: "",\n      email: "",\n      showOnDashboard: false,\n      agendaScheduled: false,\n      agendaDate: "",\n      conversationDone: false,\n      nextInteraction: "",\n      firstInteraction: "",\n      conversationDate: "",\n      relationshipStatus: "Mapear",\n      interactionStatus: "Nao iniciado"\n    };\n    await onChange(next);\n    setSelectedSupplierId((current) => current === row.id ? "" : current);\n    setEditingIds((current) => {\n      const updated = new Set(current);\n      updated.delete(row.id);\n      return updated;\n    });\n    setSavedId("");\n  };\n  const selectSupplier = (id: string) => {\n    if (!id) {\n      setSelectedSupplierId("");\n      return;\n    }\n    setSelectedSupplierId(id);\n    const selected = draftRows.find((row) => row.id === id);\n    if (selected && !isSupplierScoped(selected)) {\n      updateDraft({ ...selected, relationshipStatus: "Selecionado", interactionStatus: "Selecionado" });\n    }\n    startEdit(id);\n  };`;
            if (!app.includes('const selectSupplier = (id: string) =>')) {
              app = app.replace(/\r?\n  return \(\r?\n    <Panel\r?\n      title="Fornecedores"/, `${selectFn}\n  return (\n    <Panel\n      title="Fornecedores"`);
            }
            app = app.replace(
              /      <div className="mb-4 max-w-xl">\r?\n        <SearchBox value=\{query\} onChange=\{setQuery\} placeholder="Buscar fornecedor, categoria ou contato" \/>\r?\n      <\/div>/,
              '      <div className="mb-4 grid gap-3 lg:grid-cols-[1fr_220px]">\n        <Select disabled={!canEdit} label="Selecionar fornecedor da base" value={selectedSupplierId} onChange={selectSupplier} options={["", ...filteredBaseRows.map((item) => item.id)]} labels={{ "": "Selecione para acompanhar", ...Object.fromEntries(filteredBaseRows.map((item) => [item.id, `${item.name} | ${money(item.spend)}`])) }} />\n        <Select label="Ordenar por" value={sortBy} onChange={(value) => setSortBy(value as SupplierSort)} options={["spend", "name"]} labels={{ spend: "Spend", name: "Nome" }} />\n      </div>\n      <div className="mb-4 max-w-xl">\n        <SearchBox value={query} onChange={setQuery} placeholder="Filtrar base por fornecedor ou categoria" />\n      </div>'
            );
            app = app.replace('visible.slice(0, 120)', 'controlRows.slice(0, 120)');
            app = app.replace(/\r?\n                  <td className="p-2 align-top">\r?\n                    <input className="field" disabled=\{!canEdit \|\| !editing \|\| !row\.agendaScheduled\} type="date" value=\{row\.agendaDate \|\| ""\} onChange=\{\(event\) => updateDraft\(\{ \.\.\.row, agendaDate: event\.target\.value, agendaScheduled: Boolean\(event\.target\.value\) \|\| row\.agendaScheduled \}\)\} \/>\r?\n                  <\/td>/g, '');
            app = app.replace('onChange={(event) => updateDraft({ ...row, agendaScheduled: event.target.checked, agendaDate: event.target.checked ? row.agendaDate : "" })}', 'onChange={(event) => updateDraft({ ...row, agendaScheduled: event.target.checked })}');
            app = app.replace('if (window.confirm("Excluir este fornecedor permanentemente?")) deleteSupplier(row.id);', 'Number(row.spend || 0) > 0 ? removeFromTracking(row) : deleteSupplier(row.id)');
            app = app.replace('{visible.length > 120 && <p className="p-3 text-sm text-muted">Mostrando 120 de {visible.length} fornecedores. Use a busca para refinar.</p>}', '{!controlRows.length && <p className="p-3 text-sm text-muted">Selecione um fornecedor na lista suspensa para iniciar o acompanhamento.</p>}\n        {controlRows.length > 120 && <p className="p-3 text-sm text-muted">Mostrando 120 de {controlRows.length} fornecedores em acompanhamento. Use a busca para refinar.</p>}');
            app = app.replace('visible.map((row) => (', 'filteredBaseRows.map((row) => (');
            return app;
          });
          replaceAll('README.md', (input) => input
            .replace('Fornecedores estrategicos com selecao por lista suspensa a partir da base de spend, acompanhamento editavel por linha, pessoa contatada, cargo, agenda, realizado, marcador de dashboard, tabela de spend de referencia e exportacao PDF', 'Fornecedores estrategicos com selecao por lista suspensa a partir da base de spend, acompanhamento simples por linha, agenda, realizado, marcador de dashboard, tabela de spend de referencia e exportacao PDF')
            .replace('VITE_FIRST_DAY=2026-06-22', 'VITE_FIRST_DAY=2026-08-03'));
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- src/App.tsx README.md; then
            git add src/App.tsx README.md
            git commit -m "Fix supplier selector state"
            git push origin HEAD:main
          fi
      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://fokdjnqseqppmrjkimfu.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_C7pVM61DBzPfD0jqHLaCDQ_iR4Og0np
          VITE_FIRST_DAY: "2026-08-03"
      - name: Publish static site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir ../gh-pages-build
          cp -R dist/. ../gh-pages-build/
          touch ../gh-pages-build/.nojekyll
          cd ../gh-pages-build
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy GitHub Pages"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
